  - {symbol: "AMZN", sector: consumer}
  - {symbol: "TSLA", sector: consumer}
  - {symbol: "NFLX", sector: comm}
  - {symbol: "JPM",  sector: banks}
  - {symbol: "BAC",  sector: banks}
  - {symbol: "GS",   sector: banks}
  - {symbol: "XOM",  sector: energy}
  - {symbol: "CVX",  sector: energy}
