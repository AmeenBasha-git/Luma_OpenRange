# US market settings. Add market_in.yaml later for NSE.

timezone: America/New_York
benchmark: SPY

session:
  open: "09:30"
  or_end: "09:35"          # opening range = first 5-min candle
  flatten: "15:55"
  close: "16:00"
  bar_minutes: 5

schedule:                  # all times US/Eastern
  weekly: "Sun 18:00"
  premarket: "08:00"
  open: "09:35"
  intraday_start: "09:40"
  intraday_end: "15:50"
  close: "15:55"
  review: "16:15"

# Fake-mode universe. Phase 1 replaces this with a real liquid-stock list.
universe:
  - {symbol: "AAPL", sector: tech}
  - {symbol: "MSFT", sector: tech}
  - {symbol: "NVDA", sector: tech}
  - {symbol: "AMD",  sector: tech}
  - {symbol: "META", sector: comm}
